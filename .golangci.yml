# golangci-lint v2 — https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 3m
  # Go version follows go.mod when omitted; explicit override only if needed.

linters:
  default: standard
  enable:
    - cyclop
    - gocognit
    - gocyclo
    - gocritic
    - nestif
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    cyclop:
      # cyclop counts each switch case as +1 (unlike gocyclo, which counts the
      # switch itself). Allow 12 to accommodate clean switch dispatchers without
      # requiring artificial extraction.
      max-complexity: 12
  exclusions:
    generated: strict

formatters:
  enable:
    - goimports
